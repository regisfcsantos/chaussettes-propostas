<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>PARIS bicolores (version Mytheresa) · maquette Chaussettes Orphelines</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="loja.css">
<style>
  /* Página de produto da Mytheresa (a que a Marcia gostou): primeiro a peça sozinha em vários ângulos, em fundo claro,
     depois muitas fotos dela usada. Miniaturas em coluna, foto grande, nome da marca em destaque, tamanho num seletor. */
  body.v-mt { --papel: #fff; --la: #f5f5f4; --tinta: #111; --tinta-2: #6f6f6f; --linha: #e4e4e4; --framboesa: #111; --framboesa-escura: #000; --raio: 0; background: #fff; font-size: 14px; }
  .mt-topo { border-bottom: 1px solid var(--linha); background: #fff; position: sticky; top: 0; z-index: 20; }
  .mt-topo .l1 { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 14px 28px 8px; }
  .mt-topo .l1 nav { display: flex; gap: 22px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
  .mt-topo .l1 nav a { text-decoration: none; color: var(--tinta-2); }
  .mt-topo .l1 nav a:first-child { color: var(--tinta); border-bottom: 2px solid var(--tinta); }
  .mt-topo .logo img { height: 50px; }
  .mt-topo .icones { justify-self: end; display: flex; gap: 16px; }
  .mt-topo .icones a { position: relative; display: grid; place-items: center; }
  .mt-topo .contador { background: var(--tinta); top: -8px; right: -9px; }
  .mt-topo .l2 { display: flex; justify-content: center; gap: 28px; padding: 6px 28px 12px; font-size: 12.5px; }
  .mt-topo .l2 a { text-decoration: none; }
  .mt-topo .l2 a.ativo { font-weight: 700; }
  .mt-anuncio { background: #f5f5f4; text-align: center; font-size: 12px; padding: 8px 16px; }
  .mt-anuncio b { font-weight: 700; }
  .mt-trilha { font-size: 11.5px; color: var(--tinta-2); padding: 18px 28px; }
  .mt-trilha a { text-decoration: none; }
  .mt-produto { display: grid; grid-template-columns: 84px minmax(0, 1fr) 400px; gap: 24px 36px; padding: 0 28px 72px; align-items: start; }
  .mt-produto > * { min-width: 0; }
  .mt-minis { display: grid; gap: 6px; position: sticky; top: 140px; }
  .mt-minis button { padding: 0; border: 1px solid transparent; background: var(--la); aspect-ratio: 1 / 1; overflow: hidden; }
  .mt-minis button[aria-current="true"] { border-color: var(--tinta); }
  .mt-minis img { width: 100%; height: 100%; object-fit: cover; }
  .mt-minis .nm img { object-fit: contain; padding: 6px; mix-blend-mode: multiply; }
  .mt-minis .falta { background: repeating-linear-gradient(45deg, #fff8db, #fff8db 5px, #fff 5px, #fff 10px); font-size: 9px; font-weight: 700; color: #7a5b00; }
  .mt-palco { position: relative; background: var(--la); }
  .mt-palco .fotos { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
  .mt-palco .fotos::-webkit-scrollbar { display: none; }
  .mt-palco figure { flex: 0 0 100%; margin: 0; aspect-ratio: 4 / 5; scroll-snap-align: start; max-height: calc(100vh - 170px); }
  .mt-palco figure img { width: 100%; height: 100%; object-fit: cover; }
  .mt-palco figure.nm img { object-fit: contain; padding: 10%; mix-blend-mode: multiply; }
  .mt-palco .seta { position: absolute; top: 50%; translate: 0 -50%; width: 40px; height: 40px; border: 0; background: rgba(255,255,255,.85); display: grid; place-items: center; }
  .mt-palco .seta.esq { left: 0; } .mt-palco .seta.dir { right: 0; }
  .mt-palco .seta svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.5; }
  .mt-palco .conta { position: absolute; left: 50%; bottom: 14px; translate: -50% 0; font-size: 11.5px; background: rgba(255,255,255,.85); padding: 3px 10px; }
  .mt-info { position: sticky; top: 140px; display: grid; gap: 18px; }
  .mt-info .marca { font-family: "Playfair Display", Georgia, serif; font-size: 28px; font-weight: 600; text-transform: uppercase; letter-spacing: .02em; line-height: 1.1; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 6px; }
  .mt-info h1 { font-family: var(--sans); font-size: 16px; font-weight: 400; margin-top: 10px; }
  .mt-info .preco { font-size: 16px; font-weight: 700; }
  .mt-info .preco small { display: block; font-weight: 400; font-size: 12.5px; color: var(--tinta-2); margin-top: 2px; }
  .mt-cores { display: flex; gap: 8px; }
  .mt-cores button { width: 56px; aspect-ratio: 3 / 4; border: 1px solid transparent; background: var(--la); padding: 0; }
  .mt-cores button img { width: 100%; height: 100%; object-fit: contain; padding: 3px; mix-blend-mode: multiply; }
  .mt-cores button[aria-pressed="true"] { border-color: var(--tinta); }
  .mt-rot { font-size: 12.5px; margin-bottom: 8px; }
  .mt-rot b { font-weight: 700; }
  .mt-select { width: 100%; height: 48px; border: 1px solid var(--tinta); background: #fff; padding: 0 14px; font: inherit; appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, #111 50%), linear-gradient(135deg, #111 50%, transparent 50%); background-position: calc(100% - 20px) 21px, calc(100% - 15px) 21px; background-size: 5px 5px; background-repeat: no-repeat; }
  .mt-compra { display: grid; grid-template-columns: 1fr 52px; gap: 8px; }
  .mt-compra .btn { border-radius: 0; text-transform: uppercase; letter-spacing: .06em; font-size: 13px; }
  .mt-compra .fav { border: 1px solid var(--tinta); background: #fff; display: grid; place-items: center; }
  .mt-entrega { background: var(--la); padding: 14px 16px; display: grid; gap: 8px; font-size: 12.5px; }
  .mt-entrega p { display: flex; gap: 10px; align-items: center; }
  .mt-entrega .ico { width: 18px; height: 18px; flex: none; }
  .mt-info details { border-top: 1px solid var(--linha); }
  .mt-info details:last-of-type { border-bottom: 1px solid var(--linha); }
  .mt-info summary { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; padding: 15px 0; }
  .mt-info details > div { font-size: 13.5px; color: #333; }
  .mt-info details ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
  .mt-secao { padding: 48px 28px; border-top: 1px solid var(--linha); }
  .mt-secao h2 { font-family: var(--sans); font-size: 15px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; text-align: center; margin-bottom: 26px; }
  .mt-secao .grade-nm { border: 0; gap: 20px; }
  .mt-secao .cartao-nm { border: 0; }
  .mt-secao .cartao-nm .foto { background: var(--la); }
  .mt-secao .cartao-nm .foto img:first-of-type { mix-blend-mode: multiply; }
  .mt-rodape { background: #111; color: #ddd; padding: 40px 28px 26px; font-size: 12.5px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 28px; }
  .mt-rodape h4 { margin: 0 0 10px; color: #fff; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
  .mt-rodape ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .v-mt .barra-fixa { display: none; }
  @media (max-width: 900px) {
    .mt-topo .l1 { grid-template-columns: auto 1fr auto; padding: 10px 16px; gap: 12px; }
    .mt-topo .l1 nav, .mt-topo .l2, .mt-topo .so-pc { display: none !important; }
    .mt-topo .logo { justify-self: center; } .mt-topo .logo img { height: 38px; }
    .mt-trilha { display: none; }
    .mt-produto { grid-template-columns: 1fr; padding: 0 16px 48px; }
    .mt-minis { display: none; }
    .mt-palco { margin-inline: -16px; }
    .mt-palco figure { max-height: none; }
    .mt-palco .seta { display: none; }
    .mt-info { position: static; }
    .mt-info .marca { font-size: 22px; }
    .mt-secao { padding: 36px 16px; }
    .mt-rodape { grid-template-columns: 1fr 1fr; padding: 32px 16px 96px; }
    .v-mt .barra-fixa { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: #fff; border-top: 1px solid var(--linha); padding: 10px 16px; gap: 12px; align-items: center; }
    .v-mt .barra-fixa div { flex: 1; font-size: 12px; line-height: 1.3; min-width: 0; }
    .v-mt .barra-fixa .btn { min-height: 44px; padding: 0 18px; border-radius: 0; }
  }
</style>
</head>
<body class="v-mt">
<script src="comum.js"></script>
<script>
const SETA = d => `<svg viewBox="0 0 24 24"><path d="${d === "esq" ? "m15 4-8 8 8 8" : "m9 4 8 8-8 8"}"/></svg>`;
document.write(`
<header class="mt-topo">
  <div class="l1"><nav aria-label="Univers"><a href="#">Chaussettes</a><a href="#">Accessoires</a><a href="#">L’association</a></nav>
    <a class="so-celular" href="#" aria-label="Menu" style="display:grid;place-items:center">${ICONE.menu}</a>
    <a class="logo" href="#"><img src="https://chaussettesorphelines.com/cdn/shop/files/Logo_Chaussettes_Orphelines_black_2024_1_450x.png?v=1726070443" alt="Chaussettes Orphelines"></a>
    <div class="icones"><a class="so-pc" href="#" aria-label="Rechercher">${ICONE.busca}</a><a class="so-pc" href="#" aria-label="Mon compte">${ICONE.conta}</a><a class="so-pc" href="#" aria-label="Favoris">${ICONE.coracao}</a><a href="?panier=1" aria-label="Panier">${ICONE.sacola}<span class="contador">2</span></a></div></div>
  <nav class="l2" aria-label="Catégories"><a href="#">Nouveautés</a><a href="#" class="ativo">Chaussettes</a><a href="#">Laine recyclée</a><a href="#">Coton recyclé</a><a href="#">Bonnets, gants & écharpes</a><a href="#">Coffrets cadeaux</a><a href="#">Pièces uniques</a></nav>
</header>
<div class="mt-anuncio" data-d="D1 · D3">Livraison offerte dès <b>${REGRAS.freteGratis} €</b> · <b>−${REGRAS.pack3} %</b> dès 3 paires</div>
<nav class="mt-trilha" aria-label="Fil d’Ariane"><a href="#">Chaussettes</a> / <a href="#">Mi-hauteur</a> / ${PARIS.nome}</nav>
<main class="mt-produto">
  <div class="mt-minis" id="minis"></div>
  <div class="mt-palco"><div class="fotos" id="fotos"></div>
    <button class="seta esq" aria-label="Photo précédente" onclick="ir(atual - 1)">${SETA("esq")}</button><button class="seta dir" aria-label="Photo suivante" onclick="ir(atual + 1)">${SETA("dir")}</button>
    <span class="conta" id="conta"></span></div>
  <div class="mt-info">
    <div><a class="marca" href="#">Chaussettes Orphelines</a><h1>Chaussettes ${PARIS.nome} en jersey recyclé</h1></div>
    <div class="preco">${euro(PARIS.preco)}<small data-d="D3">${precoPack(PARIS.preco)} la paire dès 3 paires · TVA incluse</small></div>
    <div><p class="mt-rot">Couleur : <b id="nome-cor"></b></p><div class="mt-cores" id="cores"></div></div>
    <div><p class="mt-rot" style="display:flex;justify-content:space-between">Taille <a href="#">Guide des tailles</a></p><select class="mt-select" id="tamanhos" aria-label="Taille" onchange="tam=this.value;montar()"></select></div>
    <div class="mt-compra"><a class="btn" href="?panier=1" onclick="document.body.classList.add('aberto');return false">Ajouter au panier</a><button class="fav" aria-label="Ajouter aux favoris">${ICONE.coracao}</button></div>
    <div class="mt-entrega">
      <p data-d="D1">${ICONE.caminhao}<span>Livraison offerte dès ${REGRAS.freteGratis} € · expédiée sous 2 à 4 jours</span></p>
      <p data-d="D12">${ICONE.devolver}<span>Échange gratuit sous 30 jours</span></p>
      <p data-d="D11">${ICONE.reciclar}<span>Étiquette retour offerte dès ${REGRAS.etiqueta} € pour recycler vos vieilles chaussettes</span></p>
    </div>
    <div>
      <details open><summary>Détails du produit</summary><div><p>${PARIS.descricao[0]}</p><ul style="margin-top:10px">${PARIS.detalhes.split(" · ").map(x => `<li>${x}</li>`).join("")}<li>100 % recyclées</li></ul></div></details>
      <details><summary>Taille et coupe</summary><div><p>Mi-hauteur. Tailles 36/38, 39/41 et 42/44.</p></div></details>
      <details><summary>Composition</summary><div><p>${PARIS.composicao}</p></div></details>
      <details><summary>Avis clients · ${PARIS.nota.toLocaleString("fr-FR")}/5</summary><div>${PARIS.avaliacoes.map(([n, d, e, t]) => `<p style="margin-bottom:10px">${"★".repeat(e)}${"☆".repeat(5 - e)} « ${t} »<br><small>${n}, ${d}</small></p>`).join("")}</div></details>
      <details><summary>Notre engagement</summary><div><p data-d="D5">Cette paire fait vivre l’atelier solidaire de l’association Chaussettes Solidaires, pour des femmes éloignées de l’emploi.</p></div></details>
    </div>
  </div>
</main>
<section class="mt-secao"><h2>Vous aimerez aussi</h2><div class="grade-nm" id="junto"></div></section>
<footer class="mt-rodape">
  <div><h4>Service client</h4><ul><li>Livraison</li><li>Échanges et retours</li><li>Guide des tailles</li><li>Contact</li></ul></div>
  <div><h4>Chaussettes Orphelines</h4><ul><li>Notre histoire</li><li>L’association Chaussettes Solidaires</li><li>Recycler vos chaussettes</li></ul></div>
  <div><h4>Newsletter</h4><ul><li>Les nouvelles de l’atelier, une fois par mois</li></ul></div>
  <div><h4>Suivez-nous</h4><ul><li>Instagram</li><li>Facebook</li></ul></div>
</footer>
<div class="barra-fixa"><div><b>${PARIS.nome} · ${euro(PARIS.preco)}</b><br><span id="resumo"></span></div><a class="btn" href="?panier=1" onclick="document.body.classList.add('aberto');return false">Ajouter au panier</a></div>
${carrinhoParis()}`);

let cor = 0, tam = "39/41", atual = 0;
const fotos = document.getElementById("fotos"), minis = document.getElementById("minis");
// Mytheresa: primeiro a peça sozinha em vários ângulos (aqui: a foto da cor e os ângulos que faltam), depois as fotos dela usada
function montar() {
  const c = PARIS.cores[cor];
  const lista = [{ nm: true, src: c.foto }, { falta: "Photo 2 : de côté" }, { falta: "Photo 3 : de dos" }, { falta: "Photo 4 : le tricot de près" }, { nm: true, src: PARIS.grupo }, ...PARIS.usada.map(src => ({ src }))];
  fotos.innerHTML = lista.map(f => f.falta ? `<figure>${fotoFalta(f.falta)}</figure>` : `<figure class="${f.nm ? "nm" : ""}"><img src="${img(f.src, 1200)}" alt=""></figure>`).join("");
  minis.innerHTML = lista.map((f, i) => f.falta ? `<button class="falta" onclick="ir(${i})">a fotografar</button>` : `<button class="${f.nm ? "nm" : ""}" onclick="ir(${i})"><img src="${img(f.src, 160)}" alt=""></button>`).join("");
  document.getElementById("cores").innerHTML = PARIS.cores.map((x, i) => `<button aria-pressed="${i === cor}" aria-label="${x.nome}" title="${x.nome}" onclick="cor=${i};montar()"><img src="${img(x.foto, 140)}" alt=""></button>`).join("");
  document.getElementById("nome-cor").textContent = c.nome;
  if (c.esgotados.includes(tam)) tam = PARIS.tamanhos.find(t => !c.esgotados.includes(t));
  document.getElementById("tamanhos").innerHTML = PARIS.tamanhos.map(t => `<option value="${t}"${t === tam ? " selected" : ""}${c.esgotados.includes(t) ? " disabled" : ""}>${t}${c.esgotados.includes(t) ? " · épuisée, me prévenir" : ""}</option>`).join("");
  document.getElementById("resumo").textContent = `${c.nome} · ${tam}`;
  atual = 0; fotos.scrollLeft = 0; marcar();
}
function ir(i) { const n = fotos.children.length; atual = (i + n) % n; fotos.scrollTo({ left: atual * fotos.clientWidth, behavior: "smooth" }); marcar(); }
function marcar() { minis.querySelectorAll("button").forEach((b, i) => b.setAttribute("aria-current", i === atual)); document.getElementById("conta").textContent = `${atual + 1} / ${fotos.children.length}`; }
fotos.addEventListener("scroll", () => { const i = Math.round(fotos.scrollLeft / fotos.clientWidth); if (i !== atual) { atual = i; marcar(); } }, { passive: true });
montar();
addEventListener("load", () => { fotos.scrollLeft = 0; atual = 0; marcar(); });
document.getElementById("junto").innerHTML = ["summerBicolores", "summerEcru", "funny", "slower"].map(id => cartaoNM(id, "mytheresa-produto.html")).join("");
</script>
</body>
</html>
